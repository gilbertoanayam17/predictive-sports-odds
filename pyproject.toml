[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-sports-odds"
version = "0.2.0"
description = "Análisis estadístico deportivo: value bets, parlays y staking con Kelly modificado"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "joblib>=1.3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
dev = ["pytest>=7.4", "mypy>=1.8", "pandas-stubs>=2.1", "types-requests>=2.31"]

[project.scripts]
predictive-odds = "predictive_odds.cli:main"

[tool.setuptools.packages.find]
include = ["predictive_odds*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
ignore_missing_imports = true
