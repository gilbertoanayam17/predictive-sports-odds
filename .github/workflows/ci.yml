name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Errores de código (ruff, reglas pyflakes)
        run: ruff check --select F predictive_odds app.py main.py tests
      - name: Tipado (mypy)
        run: mypy predictive_odds main.py --ignore-missing-imports
      - name: Tests (pytest)
        run: python -m pytest -q
      - name: Demo de punta a punta
        run: python main.py --no-ml > /dev/null
